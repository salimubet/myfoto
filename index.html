<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Foto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%231a73e8'/%3E%3C/svg%3E">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root{
  --blue:#1a73e8; --blue-dark:#1557b0; --blue-tint:#e8f0fe;
  --red:#d93025; --red-tint:#fce8e6;
  --heart:#ea4335;
  --g50:#f8f9fa; --g100:#f1f3f4; --g200:#e8eaed; --g300:#dadce0;
  --g500:#5f6368; --g700:#3c4043; --g900:#202124;
  --bg-main:#ffffff; --bg-surface:#ffffff; --text-main:#202124; --text-sub:#5f6368; --border-clr:#dadce0;
  --row-h:210px;
  --sidebar-w:280px;
  --topbar-h:64px;
}
[data-theme="dark"] {
  --blue:#8ab4f8; --blue-dark:#aecbfa; --blue-tint:#1f3762;
  --red:#f28b82; --red-tint:#5c1d1a;
  --heart:#f28b82;
  --g50:#202124; --g100:#292a2d; --g200:#3c4043; --g300:#5f6368;
  --g500:#9aa0a6; --g700:#bdc1c6; --g900:#e8eaed;
  --bg-main:#121212; --bg-surface:#1e1f22; --text-main:#e8eaed; --text-sub:#9aa0a6; --border-clr:#3c4043;
}

@media (max-width:820px){ :root{ --row-h:112px; --sidebar-w:0px; --topbar-h:56px; } }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg-main); color:var(--text-main);
  font-family:Roboto,'Google Sans','Segoe UI',Arial,sans-serif;
  overflow:hidden; transition: background 0.2s, color 0.2s;
}
button{ font-family:inherit; }
img{ -webkit-user-drag:none; user-select:none; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--g300); border-radius:10px; }
::-webkit-scrollbar-track{ background:transparent; }

/* LOGIN SCREEN */
#login-screen{
  position:fixed; inset:0; background:var(--bg-main); z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:20px;
}
.login-box{ max-width:380px; padding:40px 32px; border-radius:16px; border:1px solid var(--border-clr); background:var(--bg-surface); }
.brand-mark{ width:56px; height:56px; margin:0 auto 18px auto; }
.login-box h1{ margin:0 0 8px 0; font-size:1.5em; font-weight:500; color:var(--text-main); }
.login-box p{ margin:0 0 26px 0; color:var(--text-sub); font-size:0.95em; line-height:1.5; }
.login-btn{
  background:var(--blue); color:#fff; border:none; padding:11px 28px; font-size:0.95em;
  border-radius:24px; cursor:pointer; font-weight:500; transition:background .15s,box-shadow .15s;
}
.login-btn:hover{ background:var(--blue-dark); box-shadow:0 1px 3px rgba(0,0,0,.3); }

/* APP SHELL */
#app{ display:none; height:100%; }
.shell{ display:flex; height:100%; }

.sidebar{
  width:var(--sidebar-w); flex:0 0 auto; background:var(--bg-surface); overflow-y:auto;
  transition:transform .2s ease; border-right:1px solid var(--border-clr); display:flex; flex-direction:column; justify-content:space-between;
}
@media (max-width:820px){
  .sidebar{ position:fixed; top:0; left:0; height:100%; width:280px; z-index:500; transform:translateX(-100%); box-shadow:0 0 0 rgba(0,0,0,0); }
  .sidebar.open{ transform:translateX(0); box-shadow:0 0 24px rgba(0,0,0,.25); }
}
.brand{ display:flex; align-items:center; gap:14px; padding:18px 22px 10px 22px; }
.brand svg{ width:34px; height:34px; flex:none; }
.brand-title{ font-size:1.35em; color:var(--text-main); font-weight:400; }
.nav{ padding:8px 0; flex:1; }
.nav-item{
  display:flex; align-items:center; gap:20px; margin:2px 0; padding:0 24px 0 26px; height:48px;
  cursor:pointer; color:var(--text-sub); border-radius:0 24px 24px 0; font-size:0.94em; font-weight:500;
  transition:background .12s;
}
.nav-item svg{ width:22px; height:22px; fill:var(--text-sub); flex:none; }
.nav-item:hover{ background:var(--g100); }
.nav-item.active{ background:var(--blue-tint); color:var(--blue-dark); }
.nav-item.active svg{ fill:var(--blue); }

.sidebar-bottom{ padding:16px 20px; border-top:1px solid var(--border-clr); }
.logout-item{
  display:flex; align-items:center; gap:16px; width:100%; padding:10px 16px; border:none; background:none;
  cursor:pointer; color:var(--red); font-size:0.92em; font-weight:500; border-radius:8px; transition:background 0.15s;
}
.logout-item:hover{ background:var(--red-tint); }
.logout-item svg{ width:20px; height:20px; fill:var(--red); }

.scrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:400; }
.scrim.show{ display:block; }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; height:100%; background:var(--bg-main); }

.topbar{
  height:var(--topbar-h); flex:0 0 auto; display:flex; align-items:center; gap:6px;
  padding:0 18px; border-bottom:1px solid var(--border-clr); background:var(--bg-surface);
}
.icon-btn{
  background:none; border:none; cursor:pointer; width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex:none; transition:background .15s; color:var(--text-sub);
}
.icon-btn:hover{ background:var(--g100); }
.icon-btn svg{ width:22px; height:22px; fill:var(--text-sub); }
.menu-btn{ display:none; }
@media (max-width:820px){ .menu-btn{ display:flex; } }

.topbar-title{ font-size:1.15em; font-weight:500; color:var(--text-main); white-space:nowrap; margin-right:4px; }
.topbar-sub{ font-size:0.82em; color:var(--text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-left:8px; }

/* SEARCH BAR DIPERLEBAR */
.search-wrap{
  flex:2; max-width:850px; display:flex; align-items:center; gap:12px; background:var(--g100);
  border-radius:24px; height:44px; padding:0 16px; margin:0 12px; min-width:120px;
}
.search-wrap svg{ width:20px; height:20px; fill:var(--text-sub); flex:none; }
.search-wrap input{ border:none; background:none; outline:none; font-size:0.95em; flex:1; min-width:0; color:var(--text-main); }
.topbar-spacer{ flex:1; }

.pill-btn{
  display:flex; align-items:center; gap:8px; height:38px; padding:0 16px; border-radius:19px;
  border:1px solid var(--border-clr); background:var(--bg-surface); cursor:pointer; font-size:0.88em; font-weight:500;
  color:var(--text-main); white-space:nowrap; transition:background .15s;
}
.pill-btn:hover{ background:var(--g100); }
.pill-btn svg{ width:18px; height:18px; fill:var(--text-main); }
@media (max-width:600px){ .pill-btn span{ display:none; } .pill-btn{ padding:0; width:38px; justify-content:center; } }

.selbar{
  height:var(--topbar-h); flex:0 0 auto; display:none; align-items:center; gap:4px; padding:0 10px;
  background:var(--blue-tint);
}
.selbar.show{ display:flex; }
.selbar .icon-btn svg{ fill:var(--blue-dark); }
.selbar .icon-btn:hover{ background:rgba(26,115,232,.12); }
.sel-count{ font-size:1.05em; font-weight:500; color:var(--blue-dark); margin-left:6px; }

.content{ flex:1; overflow-y:auto; padding:6px 16px 60px 16px; }
@media (max-width:600px){ .content{ padding:2px 4px 60px 4px; } }
.view{ display:none; }
.view.active{ display:block; }

/* GRID & CARDS */
.date-header{ font-size:0.95em; font-weight:500; color:var(--text-sub); padding:18px 6px 10px 6px; }
.justified-grid{ display:flex; flex-wrap:wrap; gap:3px; }
.g-item{
  position:relative; height:var(--row-h); margin:0; overflow:hidden; border-radius:6px; cursor:pointer;
  background:var(--g100); flex-grow:1;
}
.g-item img{ width:100%; height:100%; object-fit:cover; display:block; }
.g-item.selected{ border-radius:14px; }
.g-item.selected img{ transform:scale(.82); border-radius:12px; }
.g-item .g-scrim{ position:absolute; inset:0; background:rgba(0,0,0,0); opacity:0; transition:opacity .12s; pointer-events:none; }
.g-item:hover .g-scrim, .g-item.selected .g-scrim{ opacity:1; background:rgba(0,0,0,.12); }
.g-item.selected .g-scrim{ background:rgba(0,0,0,0); }
.g-check{
  position:absolute; top:8px; left:8px; width:24px; height:24px; border-radius:50%; border:none; cursor:pointer;
  background:transparent; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .12s;
  filter:drop-shadow(0 0 2px rgba(0,0,0,.6));
}
.g-item:hover .g-check, .g-item.selected .g-check, body.sel-mode .g-check{ opacity:1; }
.g-check svg{ width:24px; height:24px; }
.g-check .empty{ fill:#fff; display:block; }
.g-check .filled{ fill:var(--blue); display:none; }
.g-item.selected .g-check .empty{ display:none; }
.g-item.selected .g-check .filled{ display:block; }

/* ICON HEART (FAVORIT) */
.g-star{ position:absolute; top:8px; right:8px; width:20px; height:20px; pointer-events:none; filter:drop-shadow(0 0 2px rgba(0,0,0,.7)); }
.g-star svg{ width:20px; height:20px; fill:var(--heart); }

.album-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:20px; padding:14px 6px 10px 6px; }
@media (max-width:600px){ .album-grid{ grid-template-columns:repeat(2,1fr); gap:14px; } }
.album-card{ cursor:pointer; }
.album-cover{ position:relative; width:100%; padding-bottom:100%; border-radius:12px; overflow:hidden; background:var(--g100); }
.album-cover .cov-grid{ position:absolute; inset:0; display:grid; gap:2px; }
.album-cover .cov-grid img{ width:100%; height:100%; object-fit:cover; display:block; }
.album-cover .empty-folder{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.album-cover .empty-folder svg{ width:56px; height:56px; fill:var(--g300); }
.album-kebab{
  position:absolute; top:6px; right:6px; width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s;
}
.album-card:hover .album-kebab{ opacity:1; }
.album-kebab svg{ width:18px; height:18px; fill:#fff; }
.album-name{ margin-top:8px; font-size:0.92em; font-weight:500; color:var(--text-main); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.album-count{ font-size:0.8em; color:var(--text-sub); }
.folder-strip{ display:flex; flex-wrap:wrap; gap:20px; padding:14px 6px 6px 6px; }
.folder-strip .album-card{ width:150px; }
@media (max-width:600px){ .folder-strip .album-card{ width:110px; } }

/* DROPDOWN & STATUS */
.dropdown{
  position:fixed; background:var(--bg-surface); border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.25); padding:6px 0;
  min-width:180px; z-index:1500; display:none; border:1px solid var(--border-clr);
}
.dropdown.show{ display:block; }
.dropdown button{
  display:flex; align-items:center; gap:14px; width:100%; border:none; background:none; text-align:left;
  padding:10px 18px; cursor:pointer; font-size:0.9em; color:var(--text-main);
}
.dropdown button:hover{ background:var(--g100); }
.dropdown button svg{ width:20px; height:20px; fill:var(--text-sub); }
.dropdown button.danger{ color:var(--red); }
.dropdown button.danger svg{ fill:var(--red); }

.status-msg{ text-align:center; padding:70px 20px; color:var(--text-sub); }
.status-msg svg{ width:72px; height:72px; fill:var(--g300); margin-bottom:14px; }
.status-msg .t1{ font-size:1.05em; font-weight:500; color:var(--text-main); margin-bottom:4px; }
.status-msg .t2{ font-size:0.9em; }
.spinner{ border:3px solid var(--g200); border-top:3px solid var(--blue); border-radius:50%; width:32px; height:32px; animation:spin .9s linear infinite; margin:0 auto 16px auto; }
@keyframes spin{ to{ transform:rotate(360deg); } }

#toast{
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px); background:#323232; color:#fff;
  padding:14px 22px; border-radius:8px; font-size:0.9em; z-index:3000; opacity:0; pointer-events:none; transition:all .2s;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* VIEWER / LIGHTBOX (NORMAL SIZE + PINCH ZOOM / SCROLL) */
.viewer{
  display:none; position:fixed; inset:0; background:#000; z-index:2000; flex-direction:column; overflow:hidden;
}
.viewer.show{ display:flex; }
.viewer-top{
  flex:0 0 auto; height:64px; display:flex; align-items:center; gap:6px; padding:0 12px; color:#fff;
  background:linear-gradient(rgba(0,0,0,.6),transparent); position:absolute; top:0; left:0; right:0; z-index:5;
}
.viewer-top .icon-btn{ color:#fff; }
.viewer-top .icon-btn svg{ fill:#e8eaed; }
.viewer-top .icon-btn:hover{ background:rgba(255,255,255,.12); }
.viewer-titles{ display:flex; flex-direction:column; margin-left:6px; min-width:0; }
.viewer-titles .vt-name{ font-size:0.92em; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:50vw; }
.viewer-titles .vt-date{ font-size:0.76em; color:#bdc1c6; }
.viewer-spacer{ flex:1; }

.viewer-stage{
  flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; overflow:hidden; touch-action:none;
}
.viewer-track{
  display:flex; height:100%; width:100%; position:absolute; left:0; top:0; transition:transform 0.25s ease-out;
}
.viewer-slide{
  min-width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex:none; position:relative; overflow:hidden;
}
/* TAMPILAN NORMAL, BISA DIPERBESAR/PERKECIL (ZOOM) */
.viewer-slide img{
  max-width:100%; max-height:100%; object-fit:contain; user-select:none; transform-origin:center center; transition: transform 0.05s ease-out; cursor: grab;
}
.viewer-slide img:active { cursor: grabbing; }

.nav-arrow{
  position:absolute; top:50%; transform:translateY(-50%); width:48px; height:48px; border-radius:50%; border:none;
  background:rgba(32,33,36,.5); cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:4;
  transition:background .15s;
}
.nav-arrow:hover{ background:rgba(32,33,36,.85); }
.nav-arrow svg{ width:26px; height:26px; fill:#fff; }
.nav-prev{ left:14px; } .nav-next{ right:14px; }
@media (max-width:600px){ .nav-arrow{ width:38px; height:38px; } .nav-arrow svg{ width:20px; height:20px; } }

.info-panel{
  position:fixed; top:0; right:0; width:340px; max-width:88vw; height:100%; background:var(--bg-surface); z-index:10;
  transform:translateX(100%); transition:transform .2s ease; box-shadow:-2px 0 12px rgba(0,0,0,.3);
  overflow-y:auto; padding:76px 24px 24px 24px; color:var(--text-main);
}
.info-panel.show{ transform:translateX(0); }
.info-row{ display:flex; gap:16px; padding:14px 0; border-bottom:1px solid var(--border-clr); }
.info-row svg{ width:22px; height:22px; fill:var(--text-sub); flex:none; margin-top:2px; }
.info-row .ir-main{ font-size:0.92em; color:var(--text-main); }
.info-row .ir-sub{ font-size:0.8em; color:var(--text-sub); margin-top:2px; }

.bottom-nav{ display:none; }
@media (max-width:820px){
  .bottom-nav{ display:flex; height:60px; border-top:1px solid var(--border-clr); background:var(--bg-surface); flex:0 0 auto; z-index:100; }
  .bn-item{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--text-sub); cursor:pointer; border:none; background:none; font-size:0.68em; }
  .bn-item svg{ width:22px; height:22px; fill:var(--text-sub); }
  .bn-item.active{ color:var(--blue); }
  .bn-item.active svg{ fill:var(--blue); }
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <svg class="brand-mark" viewBox="0 0 48 48">
      <circle cx="24" cy="14" r="10" fill="#1a73e8"/>
      <circle cx="14" cy="30" r="10" fill="#ea4335"/>
      <circle cx="34" cy="30" r="10" fill="#fbbc04"/>
      <circle cx="24" cy="24" r="9" fill="#34a853"/>
    </svg>
    <h1>Foto</h1>
    <p>Masuk dengan Akun Google Anda untuk melihat, mengunggah, dan mengelola foto di Google Drive.</p>
    <button class="login-btn" onclick="handleAuthClick()">Login dengan Google</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="shell">
    <div class="scrim" id="scrim" onclick="toggleSidebar(false)"></div>

    <aside class="sidebar" id="sidebar">
      <div>
        <div class="brand">
          <svg viewBox="0 0 48 48">
            <circle cx="24" cy="14" r="10" fill="#1a73e8"/>
            <circle cx="14" cy="30" r="10" fill="#ea4335"/>
            <circle cx="34" cy="30" r="10" fill="#fbbc04"/>
            <circle cx="24" cy="24" r="9" fill="#34a853"/>
          </svg>
          <span class="brand-title">Foto</span>
        </div>
        <nav class="nav" id="nav-list">
          <div class="nav-item active" data-route="photos">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
            <span>Foto</span>
          </div>
          <div class="nav-item" data-route="albums">
            <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
            <span>Album</span>
          </div>
          <div class="nav-item" data-route="favorites">
            <!-- Icon Love -->
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span>Favorit</span>
          </div>
          <div class="nav-item" data-route="trash">
            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            <span>Sampah</span>
          </div>
        </nav>
      </div>
      <!-- Tombol Keluar di Sidebar Pojok Kiri -->
      <div class="sidebar-bottom">
        <button class="logout-item" onclick="logout()">
          <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L17.17 10H8v2h9.17l-1.58 1.59L17 15l4-4zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
          <span>Keluar Akun</span>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn menu-btn" onclick="toggleSidebar()" title="Menu">
          <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <button class="icon-btn" id="back-btn" style="display:none" onclick="goBack()" title="Kembali">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <span class="topbar-title" id="topbar-title">Foto</span>
        <span class="topbar-sub" id="topbar-sub"></span>
        <button class="icon-btn" id="folder-kebab-btn" style="display:none" onclick="openFolderMenu(event)" title="Opsi folder">
          <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>
        
        <!-- Search bar diperlebar & bisa digunakan di dalam folder -->
        <div class="search-wrap">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input id="search-input" type="text" placeholder="Cari foto di galeri..." oninput="onSearchInput(this.value)">
        </div>
        
        <div class="topbar-spacer"></div>
        <input type="file" id="file-upload" accept="image/*" multiple style="display:none" onchange="uploadFoto(event)">

<script>
const CLIENT_ID = '285306418460-9nf2bdhhk6nrcccroj23sta6f30jca66.apps.googleusercontent.com';
const ROOT_FOLDER_ID = '1QdieWbw6I85nUVH2VxJaZ0w5-V9tqmb_';
const SCOPES = 'https://www.googleapis.com/auth/drive';
const FIELDS = 'files(id,name,mimeType,thumbnailLink,createdTime,modifiedTime,size,imageMediaMetadata,starred,parents)';

let tokenClient, accessToken = null;
let fileNameCache = new Map();

let route = 'photos';
let currentFolderId = ROOT_FOLDER_ID;
let currentFolderName = '';
let folderStack = [];

let rawFiles = []; // Data mentah asli sebelum filter search
let flatList = []; // Data yang tampil di grid setelah filter
let viewerIndex = -1;
let selectedIds = new Set();
let searchQuery = '';

function authHeader(){ return { 'Authorization': `Bearer ${accessToken}` }; }

window.onload = function(){
  // Load Theme
  const savedTheme = localStorage.getItem('theme') || 'light';
  setTheme(savedTheme);

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if(resp && resp.access_token){
        accessToken = resp.access_token;
        localStorage.setItem('drive_session', JSON.stringify({ token: accessToken, expiresAt: Date.now() + (resp.expires_in*1000) - 60000 }));
        masukAplikasi();
      }
    }
  });
  cekSesiAktif();
};

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  setTheme(current);
}
function setTheme(theme){
  if(theme === 'dark'){
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
  }
}

function cekSesiAktif(){
  const saved = localStorage.getItem('drive_session');
  if(saved){
    const s = JSON.parse(saved);
    if(Date.now() < s.expiresAt){ accessToken = s.token; masukAplikasi(); return; }
  }
  document.getElementById('login-screen').style.display = 'flex';
}
function handleAuthClick(){ tokenClient.requestAccessToken(); }
function masukAplikasi(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  navigate('photos');
}
function logout(){
  localStorage.removeItem('drive_session');
  if(accessToken) google.accounts.oauth2.revoke(accessToken, () => location.reload());
  else location.reload();
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatBytes(bytes){
  if(!+bytes) return '0 Bytes';
  const k = 1024, sizes = ['Bytes','KB','MB','GB'];
  const i = Math.floor(Math.log(bytes)/Math.log(k));
  return `${parseFloat((bytes/Math.pow(k,i)).toFixed(2))} ${sizes[i]}`;
}
function dateLabel(d){
  const now = new Date();
  const start = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const diff = Math.round((start(now) - start(d)) / 86400000);
  if(diff === 0) return 'Hari ini';
  if(diff === 1) return 'Kemarin';
  const opts = d.getFullYear() === now.getFullYear() ? {day:'numeric',month:'long'} : {day:'numeric',month:'long',year:'numeric'};
  return d.toLocaleDateString('id-ID', opts);
}
function ratioOf(f){
  const m = f.imageMediaMetadata;
  if(m && m.width && m.height){
    const rot = (m.rotation || 0) % 2;
    return rot === 1 ? m.height/m.width : m.width/m.height;
  }
  return 1;
}
function hdUrl(f){
  return f.thumbnailLink ? f.thumbnailLink.replace(/=s\d+/, '=s1600') : `https://drive.google.com/thumbnail?id=${f.id}&sz=w1600&access_token=${accessToken}`;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove('show'), 2600);
}
function setStatus(html){
  const s = document.getElementById('status');
  if(html){ s.style.display='block'; s.innerHTML = html; } else { s.style.display='none'; s.innerHTML=''; }
}
function emptyState(iconPath, title, sub){
  return `<div class="status-msg"><svg viewBox="0 0 24 24"><path d="${iconPath}"/></svg><div class="t1">${title}</div><div class="t2">${sub}</div></div>`;
}
function loadingHtml(msg){ return `<div class="spinner"></div>${msg}`; }

function navigate(newRoute, opts){
  opts = opts || {};
  route = newRoute;
  selectedIds.clear(); updateSelectionUI();
  document.querySelectorAll('#nav-list .nav-item, #bottom-nav .bn-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.route === newRoute);
  });
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));

  const backBtn = document.getElementById('back-btn');
  const kebabBtn = document.getElementById('folder-kebab-btn');
  const title = document.getElementById('topbar-title');
  const sub = document.getElementById('topbar-sub');
  const btnUpload = document.getElementById('btn-upload');
  const btnNewFolder = document.getElementById('btn-newfolder');
  sub.textContent = '';

  if(newRoute === 'photos'){
    document.getElementById('view-photos').classList.add('active');
    backBtn.style.display='none'; kebabBtn.style.display='none';
    title.textContent='Foto'; btnUpload.style.display='flex'; btnNewFolder.style.display='none';
    loadPhotosView();
  } else if(newRoute === 'albums'){
    document.getElementById('view-albums').classList.add('active');
    backBtn.style.display='none'; kebabBtn.style.display='none';
    title.textContent='Album'; btnUpload.style.display='flex'; btnNewFolder.style.display='flex';
    currentFolderId = ROOT_FOLDER_ID;
    loadAlbumsView();
  } else if(newRoute === 'favorites'){
    document.getElementById('view-favorites').classList.add('active');
    backBtn.style.display='none'; kebabBtn.style.display='none';
    title.textContent='Favorit'; btnUpload.style.display='none'; btnNewFolder.style.display='none';
    loadFavoritesView();
  } else if(newRoute === 'trash'){
    document.getElementById('view-trash').classList.add('active');
    backBtn.style.display='none'; kebabBtn.style.display='none';
    title.textContent='Sampah'; btnUpload.style.display='none'; btnNewFolder.style.display='none';
    loadTrashView();
  } else if(newRoute === 'folder'){
    document.getElementById('view-folder').classList.add('active');
    currentFolderId = opts.folderId; currentFolderName = opts.folderName || '';
    backBtn.style.display='flex'; kebabBtn.style.display='flex';
    title.textContent = currentFolderName; btnUpload.style.display='flex'; btnNewFolder.style.display='flex';
    btnNewFolder.querySelector('span').textContent = 'Sub-folder';
    loadFolderView(currentFolderId);
  }
  if(newRoute !== 'albums' && newRoute !== 'folder'){
    document.getElementById('btn-newfolder').querySelector('span').textContent = 'Album';
  }
  document.getElementById('content-scroll').scrollTop = 0;
  toggleSidebar(false);
}

document.querySelectorAll('#nav-list .nav-item, #bottom-nav .bn-item').forEach(el=>{
  el.addEventListener('click', ()=> navigate(el.dataset.route));
});

function goBack(){
  if(route === 'folder'){
    if(folderStack.length > 0){
      const prev = folderStack.pop();
      navigate('folder', { folderId: prev.id, folderName: prev.name });
    } else {
      navigate('albums');
    }
  }
}
function openFolder(id, name){
  if(route === 'folder') folderStack.push({ id: currentFolderId, name: currentFolderName });
  navigate('folder', { folderId: id, folderName: name });
}
function refreshCurrentView(){
  if(route === 'folder') loadFolderView(currentFolderId);
  else if(route === 'photos') loadPhotosView();
  else if(route === 'albums') loadAlbumsView();
  else if(route === 'favorites') loadFavoritesView();
  else if(route === 'trash') loadTrashView();
}

function toggleSidebar(force){
  const sb = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const open = force === undefined ? !sb.classList.contains('open') : force;
  sb.classList.toggle('open', open);
  scrim.classList.toggle('show', open);
}

async function driveList(q, extraFields){
  const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&orderBy=createdTime desc&pageSize=1000&fields=${extraFields || FIELDS}`;
  const res = await fetch(url, { headers: authHeader() });
  const data = await res.json();
  if(data.error){
    if(data.error.code === 401){ logout(); }
    throw new Error(data.error.message);
  }
  return data.files || [];
}

async function loadPhotosView(){
  const el = document.getElementById('view-photos');
  el.innerHTML=''; setStatus(loadingHtml('Memuat foto...'));
  try{
    const q = `'${ROOT_FOLDER_ID}' in parents and mimeType contains 'image/' and trashed=false`;
    const files = await driveList(q);
    setStatus(null);
    rawFiles = files;
    files.forEach(f=>fileNameCache.set(f.id, f.name));
    flatList = applySearchFilter(rawFiles);
    if(flatList.length === 0){
      el.innerHTML = emptyState('M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 12h14l-4.5-6-3.5 4.5-2.5-3z','Belum ada foto','Unggah foto baru ke folder Google Drive');
      return;
    }
    el.innerHTML = renderDateGroups(flatList);
  }catch(e){ setStatus(`<b>Error:</b> ${escapeHtml(e.message)}`); }
}

async function loadAlbumsView(){
  const el = document.getElementById('view-albums');
  el.innerHTML=''; setStatus(loadingHtml('Memuat album...'));
  try{
    const q = `'${ROOT_FOLDER_ID}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const folders = await driveList(q, 'files(id,name,createdTime)');
    setStatus(null);
    if(folders.length === 0){
      el.innerHTML = emptyState('M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z','Belum ada album','Ketuk "Album" di atas untuk membuat album');
      return;
    }
    el.innerHTML = `<div class="album-grid" id="album-grid"></div>`;
    const grid = document.getElementById('album-grid');
    folders.forEach(f => grid.appendChild(buildAlbumCardSkeleton(f)));
    folders.forEach(f => hydrateAlbumCard(f));
  }catch(e){ setStatus(`<b>Error:</b> ${escapeHtml(e.message)}`); }
}

function buildAlbumCardSkeleton(folder){
  const card = document.createElement('div');
  card.className = 'album-card';
  card.dataset.id = folder.id;
  card.innerHTML = `
    <div class="album-cover" id="cov-${folder.id}">
      <div class="empty-folder"><svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg></div>
      <button class="album-kebab" data-action="folder-menu" data-id="${folder.id}" data-name="${escapeHtml(folder.name)}">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
    <div class="album-name">${escapeHtml(folder.name)}</div>
    <div class="album-count" id="cnt-${folder.id}">memuat...</div>`;
  card.addEventListener('click', (e)=>{
    if(e.target.closest('[data-action="folder-menu"]')) return;
    openFolder(folder.id, folder.name);
  });
  return card;
}

async function hydrateAlbumCard(folder){
  try{
    const q = `'${folder.id}' in parents and mimeType contains 'image/' and trashed=false`;
    const imgs = await driveList(q, 'files(id,thumbnailLink)');
    const cov = document.getElementById(`cov-${folder.id}`);
    const cnt = document.getElementById(`cnt-${folder.id}`);
    if(!cov) return;
    cnt.textContent = imgs.length === 0 ? 'Tidak ada item' : (imgs.length + (imgs.length===1?' item':' item'));
    if(imgs.length > 0){
      const top = imgs.slice(0,4);
      const cols = top.length >= 3 ? 2 : (top.length===2?2:1);
      cov.querySelector('.empty-folder').remove();
      const gridDiv = document.createElement('div');
      gridDiv.className='cov-grid';
      gridDiv.style.gridTemplateColumns = `repeat(${cols},1fr)`;
      gridDiv.innerHTML = top.map(f=>`<img src="${f.thumbnailLink}" loading="lazy">`).join('');
      cov.insertBefore(gridDiv, cov.firstChild);
    }
  }catch(e){}
}

async function loadFolderView(folderId){
  const el = document.getElementById('view-folder');
  el.innerHTML=''; setStatus(loadingHtml('Memuat folder...'));
  try{
    const qSub = `'${folderId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const qImg = `'${folderId}' in parents and mimeType contains 'image/' and trashed=false`;
    const [subfolders, images] = await Promise.all([ driveList(qSub,'files(id,name)'), driveList(qImg) ]);
    setStatus(null);
    rawFiles = images;
    images.forEach(f=>fileNameCache.set(f.id, f.name));
    flatList = applySearchFilter(rawFiles);

    let html = '';
    if(subfolders.length > 0){ html += `<div class="folder-strip" id="folder-strip"></div>`; }
    if(images.length === 0 && subfolders.length === 0){
      html += emptyState('M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z','Folder ini kosong','Unggah foto atau buat sub-folder');
    } else if(flatList.length > 0){
      html += renderDateGroups(flatList);
    }
    el.innerHTML = html;
    if(subfolders.length > 0){
      const strip = document.getElementById('folder-strip');
      subfolders.forEach(f=>{ strip.appendChild(buildAlbumCardSkeleton(f)); });
      subfolders.forEach(f=>hydrateAlbumCard(f));
    }
  }catch(e){ setStatus(`<b>Error:</b> ${escapeHtml(e.message)}`); }
}

async function loadFavoritesView(){
  const el = document.getElementById('view-favorites');
  el.innerHTML=''; setStatus(loadingHtml('Memuat favorit...'));
  try{
    const files = await driveList(`starred=true and mimeType contains 'image/' and trashed=false`);
    setStatus(null);
    rawFiles = files;
    files.forEach(f=>fileNameCache.set(f.id, f.name));
    flatList = applySearchFilter(rawFiles);
    if(flatList.length === 0){
      el.innerHTML = emptyState('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z','Belum ada favorit','Tandai hati pada foto untuk menyimpannya di sini');
      return;
    }
    el.innerHTML = renderDateGroups(flatList);
  }catch(e){ setStatus(`<b>Error:</b> ${escapeHtml(e.message)}`); }
}

async function loadTrashView(){
  const el = document.getElementById('view-trash');
  el.innerHTML=''; setStatus(loadingHtml('Memuat sampah...'));
  try{
    const files = await driveList(`trashed=true and (mimeType contains 'image/' or mimeType='application/vnd.google-apps.folder')`, FIELDS);
    setStatus(null);
    if(files.length === 0){
      el.innerHTML = emptyState('M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z','Sampah kosong','Item yang dihapus akan muncul di sini');
      return;
    }
    const folders = files.filter(f=>f.mimeType==='application/vnd.google-apps.folder');
    const images = files.filter(f=>f.mimeType!=='application/vnd.google-apps.folder');
    let html='';
    if(folders.length>0) html += `<div class="date-header">Folder</div><div class="folder-strip" id="trash-folder-strip"></div>`;
    if(images.length>0) html += `<div class="date-header">Foto</div><div class="justified-grid" id="trash-grid"></div>`;
    el.innerHTML = html;
    if(folders.length>0){
      const strip = document.getElementById('trash-folder-strip');
      folders.forEach(f=>{
        const card = document.createElement('div');
        card.className='album-card';
        card.innerHTML = `<div class="album-cover"><div class="empty-folder"><svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg></div></div><div class="album-name">${escapeHtml(f.name)}</div>`;
        card.style.cursor='default';
        const actions = document.createElement('div');
        actions.style.cssText='display:flex;gap:6px;margin-top:6px;';
        actions.innerHTML = `<button class="pill-btn" data-action="restore" data-id="${f.id}" style="height:30px;padding:0 10px;font-size:.78em;">Pulihkan</button><button class="pill-btn" data-action="delete-forever" data-id="${f.id}" style="height:30px;padding:0 10px;font-size:.78em;color:var(--red);">Hapus</button>`;
        card.appendChild(actions); strip.appendChild(card);
      });
    }
    if(images.length>0){
      const grid = document.getElementById('trash-grid');
      images.forEach(f=>{
        const ratio = ratioOf(f);
        const item = document.createElement('div');
        item.className='g-item'; item.style.flexGrow=ratio; item.style.flexBasis=`calc(${ratio} * var(--row-h))`;
        item.innerHTML = `<img src="${f.thumbnailLink||''}" loading="lazy">`;
        grid.appendChild(item);
      });
    }
  }catch(e){ setStatus(`<b>Error:</b> ${escapeHtml(e.message)}`); }
}

function renderDateGroups(files){
  const groups = new Map();
  files.forEach(f=>{
    const label = dateLabel(new Date(f.createdTime));
    if(!groups.has(label)) groups.set(label, []);
    groups.get(label).push(f);
  });
  let html='';
  groups.forEach((list, label)=>{
    html += `<div class="date-header">${escapeHtml(label)}</div><div class="justified-grid">`;
    list.forEach(f=>{
      const ratio = ratioOf(f);
      const sel = selectedIds.has(f.id) ? ' selected' : '';
      html += `
        <div class="g-item${sel}" data-id="${f.id}" data-action="grid-item" style="flex-grow:${ratio};flex-basis:calc(${ratio} * var(--row-h))">
          <img src="${f.thumbnailLink || ''}" loading="lazy" alt="${escapeHtml(f.name)}">
          <div class="g-scrim"></div>
          ${f.starred ? `<span class="g-star"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>` : ''}
          <button class="g-check" data-action="toggle-select" data-id="${f.id}">
            <svg class="empty" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            <svg class="filled" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          </button>
        </div>`;
    });
    html += `</div>`;
  });
  return html;
}

function applySearchFilter(files){
  if(!searchQuery) return files;
  const q = searchQuery.toLowerCase();
  return files.filter(f => f.name.toLowerCase().includes(q));
}
function onSearchInput(val){
  searchQuery = val.trim();
  flatList = applySearchFilter(rawFiles);
  const el = document.getElementById(route === 'folder' ? 'view-folder' : 'view-photos');
  if(route === 'photos' || route === 'folder'){
    el.innerHTML = flatList.length === 0 ? emptyState('M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z','Tidak ditemukan','Pencarian tidak cocok') : renderDateGroups(flatList);
  }
}

document.getElementById('content-scroll').addEventListener('click', (e)=>{
  const check = e.target.closest('[data-action="toggle-select"]');
  if(check){ e.stopPropagation(); toggleSelect(check.dataset.id); return; }
  const restoreBtn = e.target.closest('[data-action="restore"]');
  if(restoreBtn){ e.stopPropagation(); restoreItem(restoreBtn.dataset.id); return; }
  const delForever = e.target.closest('[data-action="delete-forever"]');
  if(delForever){ e.stopPropagation(); deleteForever(delForever.dataset.id); return; }
  const menuBtn = e.target.closest('[data-action="folder-menu"]');
  if(menuBtn){ e.stopPropagation(); openAlbumKebab(menuBtn, menuBtn.dataset.id, menuBtn.dataset.name); return; }
  const item = e.target.closest('[data-action="grid-item"]');
  if(item){
    const id = item.dataset.id;
    if(selectedIds.size > 0){ toggleSelect(id); }
    else { openViewerById(id); }
  }
});

function toggleSelect(id){
  if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  updateSelectionUI();
  document.querySelectorAll(`.g-item[data-id="${cssEscape(id)}"]`).forEach(el=>{
    el.classList.toggle('selected', selectedIds.has(id));
  });
}
function cssEscape(s){ return String(s).replace(/(["\\])/g,'\\$1'); }
function clearSelection(){
  selectedIds.clear(); updateSelectionUI();
  document.querySelectorAll('.g-item.selected').forEach(el=>el.classList.remove('selected'));
}
function updateSelectionUI(){
  const has = selectedIds.size > 0;
  document.body.classList.toggle('sel-mode', has);
  document.getElementById('topbar').style.display = has ? 'none' : 'flex';
  document.getElementById('selbar').classList.toggle('show', has);
  document.getElementById('sel-count').textContent = `${selectedIds.size} dipilih`;
}
async function downloadSelected(){
  const ids = [...selectedIds];
  showToast(`Mengunduh ${ids.length} foto...`);
  for(const id of ids){ await downloadFileById(id); }
}

/* PERBAIKAN: Hapus / Sampah agar langsung masuk ke folder trash */
async function deleteSelected(){
  const ids = [...selectedIds];
  if(!confirm(`Pindahkan ${ids.length} foto ke sampah?`)) return;
  showToast('Memindahkan ke sampah...');
  await Promise.all(ids.map(id => fetch(`https://www.googleapis.com/drive/v3/files/${id}`, { method:'PATCH', headers:{...authHeader(),'Content-Type':'application/json'}, body: JSON.stringify({trashed:true}) })));
  clearSelection(); showToast('Berhasil dipindahkan ke sampah'); refreshCurrentView();
}
async function downloadFileById(id){
  try{
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers: authHeader() });
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = fileNameCache.get(id) || 'foto.jpg';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ showToast('Gagal mengunduh'); }
}

async function restoreItem(id){
  showToast('Memulihkan...');
  await fetch(`https://www.googleapis.com/drive/v3/files/${id}`, { method:'PATCH', headers:{...authHeader(),'Content-Type':'application/json'}, body: JSON.stringify({trashed:false}) });
  showToast('Item dipulihkan'); loadTrashView();
}
async function deleteForever(id){
  if(!confirm('Hapus permanen item ini?')) return;
  showToast('Menghapus permanen...');
  await fetch(`https://www.googleapis.com/drive/v3/files/${id}`, { method:'DELETE', headers: authHeader() });
  showToast('Item dihapus permanen'); loadTrashView();
}

async function buatFolderBaru(){
  const label = route === 'folder' ? 'sub-folder' : 'album';
  const name = prompt(`Nama ${label} baru:`);
  if(!name || !name.trim()) return;
  const target = route === 'folder' ? currentFolderId : ROOT_FOLDER_ID;
  showToast('Membuat...');
  await fetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST', headers:{...authHeader(),'Content-Type':'application/json'},
    body: JSON.stringify({ name: name.trim(), mimeType:'application/vnd.google-apps.folder', parents:[target] })
  });
  showToast('Folder dibuat'); refreshCurrentView();
}

async function uploadFoto(event){
  const files = event.target.files;
  if(!files || files.length === 0) return;
  const target = route === 'folder' ? currentFolderId : ROOT_FOLDER_ID;
  showToast(`Mengunggah ${files.length} foto...`);
  for(let i=0;i<files.length;i++){
    const file = files[i];
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable', {
      method:'POST', headers:{...authHeader(),'Content-Type':'application/json'},
      body: JSON.stringify({ name: file.name, parents:[target] })
    });
    const uploadUrl = res.headers.get('Location');
    if(uploadUrl) await fetch(uploadUrl, { method:'PUT', headers:{'Content-Type':file.type}, body:file });
  }
  event.target.value = ''; showToast('Unggahan selesai'); refreshCurrentView();
}

function openFolderMenu(e){
  showDropdown(e.currentTarget, [
    { label:'Ganti nama folder', icon:'M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z', action:()=>renameFile(currentFolderId, currentFolderName) },
    { label:'Pindahkan ke sampah', icon:'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z', danger:true, action:()=>deleteFile(currentFolderId, currentFolderName, true) }
  ]);
}
function openAlbumKebab(anchor, id, name){
  showDropdown(anchor, [
    { label:'Ganti nama', icon:'M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z', action:()=>renameFile(id,name) },
    { label:'Pindahkan ke sampah', icon:'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z', danger:true, action:()=>deleteFile(id,name,false) }
  ]);
}
function showDropdown(anchor, items){
  const dd = document.getElementById('dropdown');
  const r = anchor.getBoundingClientRect();
  dd.innerHTML = items.map((it,idx)=>`<button data-idx="${idx}" class="${it.danger?'danger':''}"><svg viewBox="0 0 24 24"><path d="${it.icon}"/></svg>${it.label}</button>`).join('');
  dd.style.top = (r.bottom+6)+'px';
  dd.style.left = Math.max(8, r.right-200)+'px';
  dd.classList.add('show');
  dd.querySelectorAll('button').forEach((b,idx)=>b.onclick = ()=>{ dd.classList.remove('show'); items[idx].action(); });
  const closeOnce = (ev)=>{ if(!dd.contains(ev.target)){ dd.classList.remove('show'); document.removeEventListener('click', closeOnce, true); } };
  setTimeout(()=>document.addEventListener('click', closeOnce, true), 0);
}
async function renameFile(id, oldName){
  const newName = prompt('Nama baru:', oldName);
  if(!newName || !newName.trim() || newName === oldName) return;
  showToast('Mengganti nama...');
  await fetch(`https://www.googleapis.com/drive/v3/files/${id}`, { method:'PATCH', headers:{...authHeader(),'Content-Type':'application/json'}, body: JSON.stringify({name:newName.trim()}) });
  if(id === currentFolderId){ currentFolderName = newName.trim(); document.getElementById('topbar-title').textContent = currentFolderName; }
  showToast('Berhasil'); refreshCurrentView();
}
async function deleteFile(id, name, isCurrentFolder){
  if(!confirm(`Pindahkan "${name}" ke sampah?`)) return;
  showToast('Menghapus...');
  await fetch(`https://www.googleapis.com/drive/v3/files/${id}`, { method:'PATCH', headers:{...authHeader(),'Content-Type':'application/json'}, body: JSON.stringify({trashed:true}) });
  showToast('Berhasil');
  if(isCurrentFolder) goBack(); else refreshCurrentView();
}

/* ============================================================
   VIEWER / LIGHTBOX DENGAN ZOOM NORMAL & SLIDE
   ============================================================ */
function openViewerById(id){
  const idx = flatList.findIndex(f=>f.id === id);
  if(idx === -1) return;
  viewerIndex = idx;
  renderViewerTrack();
  document.getElementById('viewer').classList.add('show');
}
function closeViewer(){
  document.getElementById('viewer').classList.remove('show');
  document.getElementById('info-panel').classList.remove('show');
  document.getElementById('viewer-track').innerHTML = '';
}
function navViewer(delta){
  const next = viewerIndex + delta;
  if(next < 0 || next >= flatList.length) return;
  viewerIndex = next; updateViewerPosition();
}

function renderViewerTrack(){
  const track = document.getElementById('viewer-track');
  track.innerHTML = flatList.map((f, i) => `
    <div class="viewer-slide" data-index="${i}">
      <img src="${i === viewerIndex ? hdUrl(f) : ''}" data-src="${hdUrl(f)}" alt="${escapeHtml(f.name)}" loading="lazy">
    </div>
  `).join('');
  updateViewerPosition();
  preloadAdjacentImages();
}

function updateViewerPosition(){
  const track = document.getElementById('viewer-track');
  track.style.transform = `translateX(-${viewerIndex * 100}%)`;
  preloadAdjacentImages();

  const f = flatList[viewerIndex];
  if(!f) return;
  document.getElementById('vt-name').textContent = f.name;
  document.getElementById('vt-date').textContent = new Date(f.createdTime).toLocaleString('id-ID', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
  document.getElementById('info-panel').classList.remove('show');
  const starBtn = document.getElementById('star-btn');
  starBtn.querySelector('svg').style.fill = f.starred ? 'var(--heart)' : '#e8eaed';
  document.querySelector('.nav-prev').style.visibility = viewerIndex<=0 ? 'hidden':'visible';
  document.querySelector('.nav-next').style.visibility = viewerIndex>=flatList.length-1 ? 'hidden':'visible';
}

function preloadAdjacentImages(){
  const slides = document.querySelectorAll('.viewer-slide');
  [viewerIndex - 1, viewerIndex, viewerIndex + 1].forEach(idx => {
    if(slides[idx]){
      const img = slides[idx].querySelector('img');
      if(img && !img.src) img.src = img.dataset.src;
    }
  });
}

function currentFile(){ return flatList[viewerIndex]; }

document.addEventListener('keydown', (e)=>{
  if(!document.getElementById('viewer').classList.contains('show')) return;
  if(e.key==='Escape') closeViewer();
  if(e.key==='ArrowLeft') navViewer(-1);
  if(e.key==='ArrowRight') navViewer(1);
});

async function toggleStarCurrent(){
  const f = currentFile(); if(!f) return;
  f.starred = !f.starred;
  document.getElementById('star-btn').querySelector('svg').style.fill = f.starred ? 'var(--heart)' : '#e8eaed';

}

/* Interaksi Pinch-to-Zoom / Scroll / Drag pada Foto */
(function(){
  let scale = 1, panning = false, pointX = 0, pointY = 0, startX = 0, startY = 0, initialDist = null;
  const stage = document.getElementById('viewer-stage');

  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const img = stage.querySelector('.viewer-slide[data-index="'+viewerIndex+'"] img');
    if(!img) return;
    const delta = e.deltaY < 0 ? 1.1 : 0.9;
    scale = Math.min(Math.max(1, scale * delta), 5);
    if(scale === 1) { pointX = 0; pointY = 0; }
    img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
  }, {passive: false});

  stage.addEventListener('touchstart', e => {
    if(e.touches.length === 2){
      initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    } else if(e.touches.length === 1 && scale > 1){
      panning = true;
      startX = e.touches[0].clientX - pointX;
      startY = e.touches[0].clientY - pointY;
    }
  }, {passive: true});

  stage.addEventListener('touchmove', e => {
    const img = stage.querySelector('.viewer-slide[data-index="'+viewerIndex+'"] img');
    if(!img) return;
    if(e.touches.length === 2 && initialDist){
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      const delta = dist / initialDist;
      scale = Math.min(Math.max(1, scale * delta), 5);
      initialDist = dist;
      img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    } else if(e.touches.length === 1 && panning && scale > 1){
      pointX = e.touches[0].clientX - startX;
      pointY = e.touches[0].clientY - startY;
      img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }
  }, {passive: true});

  stage.addEventListener('touchend', e => {
    if(e.touches.length < 2) initialDist = null;
    if(e.touches.length === 0) panning = false;
  }, {passive: true});
})();
</script>
